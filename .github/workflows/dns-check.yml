# فحص تشخيصي مؤقّت لإعداد النطاق. يُحذف بعد استخدامه.
name: dns-check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "النطاق المراد فحصه"
        required: true
        default: "beautyvibes.net"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: التفويض عند سجلّ النطاق
        run: |
          D="${{ inputs.domain }}"
          echo "خوادم الأسماء المسجّلة عند .net (مع مدّة الصلاحية):"
          dig NS "$D" @a.gtld-servers.net +noall +authority || true

      - name: انتشار الاسم عبر محلّلات متنوّعة
        run: |
          D="${{ inputs.domain }}"
          # محلّلات من مشغّلين مختلفين وقارّات مختلفة، لقياس مدى الانتشار.
          for entry in "8.8.8.8:Google" "1.1.1.1:Cloudflare" "9.9.9.9:Quad9" \
                       "208.67.222.222:OpenDNS" "94.140.14.14:AdGuard" \
                       "77.88.8.8:Yandex" "64.6.64.6:Verisign" "156.154.70.1:Neustar"; do
            ip="${entry%%:*}"; name="${entry##*:}"
            a=$(dig +short +time=3 +tries=1 A "$D" @"$ip" 2>/dev/null | tr '\n' ' ')
            printf "%-16s %-12s → %s\n" "$name" "$ip" "${a:-(لا شيء)}"
          done

      - name: طلب HTTP فعلي
        run: |
          D="${{ inputs.domain }}"
          for u in "https://$D/" "https://www.$D/"; do
            echo -n "$u -> "
            curl -s -o /dev/null -m 25 -w "code=%{http_code} ip=%{remote_ip}\n" "$u" || echo "فشل الاتصال"
          done
          echo
          echo "=== عيّنة من محتوى الصفحة ==="
          curl -s -m 25 "https://$D/" | grep -oE "<title>[^<]*</title>" || echo "تعذّر جلب المحتوى"
