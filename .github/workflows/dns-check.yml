# فحص تشخيصي مؤقّت لإعداد النطاق. يُحذف بعد استخدامه.
name: dns-check

on:
  workflow_dispatch:
    inputs:
      domain:
        required: true
        default: "beautyvibes.net"
      country:
        required: true
        default: "sa"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: هل هناك خلل DNSSEC؟
        run: |
          D="${{ inputs.domain }}"
          echo "=== توقيع النطاق (DS) عند سجلّ .net ==="
          # DS موجود بلا مفاتيح مطابقة عند الخوادم الجديدة = SERVFAIL عند كل
          # محلّل يتحقّق من التواقيع. وغيابه ينفي هذا السبب نفيًا قاطعًا.
          dig DS "$D" @a.gtld-servers.net +noall +answer +authority \
            | grep -E "IN\s+(DS|NSEC3)" | head -4
          echo
          echo "-- رايات جواب محلّل متحقّق (ad = موثّق) --"
          dig "$D" A @8.8.8.8 +dnssec +noall +comment | grep -E "flags:|status:"
          echo
          echo "-- الجواب مع تعطيل التحقّق (+cd): --"
          dig "$D" A @8.8.8.8 +cd +short

      - name: خوادم النطاق نفسها
        run: |
          D="${{ inputs.domain }}"
          for ns in dns1.registrar-servers.com dns2.registrar-servers.com; do
            printf "%-32s → %s\n" "$ns" "$(dig "$D" A @"$ns" +short +time=3 +tries=1 | tr '\n' ' ')"
          done

      - name: المحلّلات داخل الدولة
        run: |
          D="${{ inputs.domain }}"
          curl -s -m 30 "https://public-dns.info/nameserver/${{ inputs.country }}.txt" -o list.txt || true
          [ -s list.txt ] || { echo "تعذّر جلب القائمة"; exit 0; }
          grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' list.txt | head -60 > ips.txt
          echo "المفحوصة: $(wc -l < ips.txt) محلّلًا داخل ${{ inputs.country }}"
          echo

          cat > probe.sh <<'SH'
          #!/bin/bash
          ip="$1"; D="$2"
          # ضابط: محلّل لا يجيب عن example.com معطّل، فلا دليل فيه.
          ctrl=$(timeout 4 dig +short +time=2 +tries=1 A example.com @"$ip" 2>/dev/null | head -1)
          [ -z "$ctrl" ] && { echo "DEAD $ip"; exit 0; }
          a=$(timeout 4 dig +short +time=2 +tries=1 A "$D" @"$ip" 2>/dev/null | head -1)
          if [ "$a" = "216.198.79.1" ]; then echo "OK   $ip"; else echo "FAIL $ip ${a:-(لا جواب)}"; fi
          SH
          chmod +x probe.sh

          xargs -a ips.txt -P 20 -I{} ./probe.sh {} "$D" > res.txt 2>/dev/null || true

          grep '^OK'   res.txt | head -20
          grep '^FAIL' res.txt | head -20
          echo
          echo "============ الحصيلة ============"
          printf "  صحيح  : %s\n" "$(grep -c '^OK'   res.txt)"
          printf "  فاشل  : %s\n" "$(grep -c '^FAIL' res.txt)"
          printf "  معطّل  : %s  (مستبعد)\n" "$(grep -c '^DEAD' res.txt)"
