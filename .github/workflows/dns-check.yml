# فحص تشخيصي مؤقّت لإعداد النطاق. يُحذف بعد استخدامه.
name: dns-check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "النطاق المراد فحصه"
        required: true
        default: "beautyvibes.net"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: الموقع يستجيب
        run: |
          D="${{ inputs.domain }}"
          curl -s -o /dev/null -m 25 -w "https://$D/ → code=%{http_code} ip=%{remote_ip}\n" "https://$D/"
          curl -s -m 25 "https://$D/" | grep -oE "<title>[^<]*</title>"

      - name: هل التقط البناء النطاق الجديد؟
        run: |
          D="${{ inputs.domain }}"

          echo "=== أول ثلاثة روابط في خريطة الموقع ==="
          curl -s -m 25 "https://$D/sitemap.xml" | grep -oE "<loc>[^<]*</loc>" | head -3

          echo
          echo "=== عدد الروابط بكل عنوان ==="
          MAP=$(curl -s -m 25 "https://$D/sitemap.xml")
          printf "beautyvibes.net : %s\n" "$(echo "$MAP" | grep -c 'beautyvibes\.net')"
          printf "vercel.app      : %s\n" "$(echo "$MAP" | grep -c 'vercel\.app')"

          echo
          echo "=== الرابط المعياري (canonical) للصفحة الرئيسة ==="
          curl -s -m 25 "https://$D/" | grep -oE '<link rel="canonical"[^>]*>' | head -2

          echo
          echo "=== خريطة الموقع في robots.txt ==="
          curl -s -m 25 "https://$D/robots.txt" | grep -i "sitemap" || true
