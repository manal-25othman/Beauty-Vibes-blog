# فحص تشخيصي مؤقّت لإعداد النطاق. يُحذف بعد استخدامه.
name: dns-check

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "النطاق المراد فحصه"
        required: true
        default: "beautyvibes.net"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: سؤال خوادم Vercel مباشرة
        run: |
          D="${{ inputs.domain }}"

          # الفرق الحاسم: هل تملك Vercel منطقة DNS لهذا النطاق أصلًا؟
          # NOERROR + SOA = تملكها. REFUSED = التفويض يشير إليها وهي لا تعرفه.
          for ns in ns1.vercel-dns.com ns2.vercel-dns.com; do
            echo "=== $ns ==="
            dig SOA "$D" @$ns +noall +comment +answer +authority || true
            echo "--- A ---"
            dig A "$D" @$ns +noall +comment +answer || true
            echo
          done

          echo "=== تتبّع كامل من الجذر ==="
          dig +trace "$D" A 2>&1 | tail -25 || true

          echo
          echo "=== حالة النطاق عند السجلّ ==="
          sudo apt-get install -y whois >/dev/null 2>&1 || true
          whois "$D" | grep -iE "domain status|name server|registrar:|expiry|expiration|creation" || echo "whois غير متاح"
