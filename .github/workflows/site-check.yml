# فحص تشخيصي مؤقّت. يُحذف بعد استخدامه.
name: site-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: ما يظهر في HTML الأوّلي
        run: |
          D="https://beautyvibes.net"
          HTML=$(curl -s -m 25 "$D/")
          echo -n "معرّف القياس في HTML : "
          echo "$HTML" | grep -oE "G-[A-Z0-9]{6,}" | sort -u | head -1 || echo "(غير موجود)"
          echo -n "وسم التحقّق          : "
          echo "$HTML" | grep -oE 'content="[A-Za-z0-9_-]{30,}"' | head -1 || echo "(غير موجود)"

      - run: npm i -s playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: ما يحدث فعلًا في متصفّح
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          const p = await b.newPage();

          // كل طلب خارج إلى جوجل — هذا هو الدليل القاطع على عمل القياس.
          const hits = [];
          p.on("request", (r) => {
            const u = r.url();
            if (/googletagmanager\.com|google-analytics\.com|\/g\/collect/.test(u)) hits.push(u);
          });

          await p.goto("https://beautyvibes.net/", { waitUntil: "load" });
          await p.waitForTimeout(6000);

          const gtag = await p.evaluate(() => typeof window.gtag);
          const layer = await p.evaluate(() => (window.dataLayer || []).length);

          console.log("typeof window.gtag :", gtag);
          console.log("عناصر dataLayer    :", layer);
          console.log("طلبات إلى جوجل     :", hits.length);
          for (const h of hits.slice(0, 6)) console.log("   ", h.slice(0, 110));

          await b.close();
          JS
          node probe.mjs
