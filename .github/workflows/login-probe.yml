# فحص تشخيصي مؤقّت لمسار الدخول. يُحذف بعد استخدامه.
name: login-probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - run: npm i -s playwright@1.49.1 && npx playwright install --with-deps chromium

      - name: قارن مسار الدخول على النطاقين
        run: |
          cat > probe.mjs <<'JS'
          import { chromium } from "playwright";

          // بيانات خاطئة عمدًا: الهدف قياس سلوك المسار، لا الدخول.
          const EMAIL = "probe-not-a-real-account@example.com";
          const PASS  = "DefinitelyWrong123";

          const browser = await chromium.launch();
          for (const base of ["https://beautyvibes.net", "https://jamalik-six.vercel.app"]) {
            console.log("=".repeat(58));
            console.log(base);
            const ctx = await browser.newContext();
            const page = await ctx.newPage();

            const res = await page.goto(base + "/admin/login", { waitUntil: "domcontentloaded" });
            console.log("  صفحة الدخول      :", res?.status());
            console.log("  الحقول موجودة    :", await page.locator("#login-email").count() > 0);

            await page.locator("#login-email").fill(EMAIL);
            await page.locator("#login-password").fill(PASS);
            await page.getByRole("button", { name: "تسجيل الدخول" }).click();
            await page.waitForTimeout(3500);

            const body = await page.locator("body").innerText();
            console.log("  بعد الإرسال URL  :", page.url());
            console.log("  رسالة «غير صحيحة»:", body.includes("غير صحيحة"));
            console.log("  خطأ خادم (500)   :", body.includes("500") || /Application error/i.test(body));
            console.log("  نصّ ظاهر         :", body.replace(/\s+/g, " ").slice(0, 180));

            // هل يُعاد التوجيه لصفحة الدخول عند طلب اللوحة بلا جلسة؟
            const g = await page.goto(base + "/admin", { waitUntil: "domcontentloaded" });
            console.log("  /admin بلا جلسة  :", g?.status(), "→", page.url());

            await ctx.close();
          }
          await browser.close();
          JS
          node probe.mjs
